<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="utf-8" />
  <title>Music Education Interface</title>

  <base href="/" />

  <meta name="color-scheme" content="light" />
  <meta name="viewport"
    content="viewport-fit=cover, width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="format-detection" content="telephone=no" />
  <meta name="msapplication-tap-highlight" content="no" />

  <link rel="icon" type="image/png" href="assets/icon/favicon.png" />

  <!-- add to homescreen for ios -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black" />
</head>

<body>
  <script>
    // Dark Mode before Angular starts (same rule as initialDarkMode): the
    // saved setting, otherwise the OS colour scheme.
    try {
      var saved = localStorage.getItem('isDarkMode');
      if (saved !== null ? JSON.parse(saved) === true : matchMedia('(prefers-color-scheme: dark)').matches) {
        document.body.classList.add('dark-theme');
      }
    } catch (e) {}
  </script>
  <app-root></app-root>
  <script src="https://accounts.google.com/gsi/client" async defer ></script>
</body>

</html>
